name: student_assistant
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  http: 1.6.0
  intl: ^0.19.0
  path_provider: 2.1.5
  flutter_secure_storage: 9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/favicon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/taibah_logo.png
